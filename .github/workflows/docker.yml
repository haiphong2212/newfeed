name: Build and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Test
        run: go test ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push API Gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api-gateway/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/newfeed:api-latest
            ${{ secrets.DOCKERHUB_USERNAME }}/newfeed:api-${{ github.sha }}

      - name: Build and Push Reverse Proxy Gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/docker/Dockerfile.gateway
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/newfeed:gateway-latest
            ${{ secrets.DOCKERHUB_USERNAME }}/newfeed:gateway-${{ github.sha }}

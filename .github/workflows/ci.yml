name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go test ./...
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r services/crawl-service/requirements.txt
      - run: PYTHONPATH=services/crawl-service pytest services/crawl-service/tests

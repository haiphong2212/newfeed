services:
  gateway:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.gateway
    container_name: newfeed-reverse-proxy
    ports:
      - "80:80"
      - "443:443"
    environment:
      - PORT=80
      - APP_HOST=app.newfeed.site
      - ADMIN_HOST=admin.newfeed.site
      - API_HOST=api.newfeed.site
      - APP_TARGET=http://frontend-user:3000
      - ADMIN_TARGET=http://frontend-admin:3001
      - API_TARGET=http://api:8080
      - CORS_ALLOWED_ORIGINS=https://app.newfeed.site,https://admin.newfeed.site
      - AUTH_COOKIE_NAMES=newfeed_access_token,newfeed_refresh_token
      - CSRF_COOKIE_NAME=csrf_token
      - COOKIE_SECURE=true
      - RATE_LIMIT_RPS=20
      - SHUTDOWN_TIMEOUT=30s
    depends_on:
      - frontend-user
      - frontend-admin
      - api
    networks:
      - newfeed-public
      - newfeed-private
    restart: unless-stopped

  frontend-user:
    image: nginx:1.27-alpine
    container_name: newfeed-frontend-user
    expose:
      - "3000"
    networks:
      - newfeed-private

  frontend-admin:
    image: nginx:1.27-alpine
    container_name: newfeed-frontend-admin
    expose:
      - "3001"
    networks:
      - newfeed-private

  api:
    build:
      context: ../..
      dockerfile: services/api-gateway/Dockerfile
    container_name: newfeed-api
    expose:
      - "8080"
    environment:
      - HTTP_ADDR=:8080
      - AUTH_SERVICE_URL=auth-service:50051
      - USER_SERVICE_URL=user-service:50052
      - NEWS_SERVICE_URL=news-service:50053
      - SEARCH_SERVICE_URL=search-service:50056
    networks:
      - newfeed-private

  postgres:
    image: postgres:15-alpine
    container_name: newfeed-postgres
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME:-newfeed}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - newfeed-private

  redis:
    image: redis:7-alpine
    container_name: newfeed-redis
    volumes:
      - redis_data:/data
    networks:
      - newfeed-private

volumes:
  postgres_data:
  redis_data:

networks:
  newfeed-public:
  newfeed-private:
    internal: true
